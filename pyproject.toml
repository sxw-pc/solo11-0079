[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drillverify"
version = "1.0.0"
description = "Offline restore-drill evidence verification and remediation planning bench"
requires-python = ">=3.10"
dependencies = [
  "Flask>=3.0,<4",
  "PyYAML>=6.0,<7",
  "Jinja2>=3.1,<4",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9"]

[project.scripts]
drillverify = "drillverify.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
drillverify = ["templates/*.html", "static/*.css"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
